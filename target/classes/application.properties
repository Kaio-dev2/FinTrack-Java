spring.application.name=fintrack

# ===========================
# CONFIGURA��O DO BANCO MySQL
# ===========================
spring.datasource.url=jdbc:mysql://localhost:3306/fintrack?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================
# CONFIGURA��O DO JPA/HIBERNATE
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===========================
# CONFIGURA��O DO SERVIDOR
# ===========================
server.port=8081
